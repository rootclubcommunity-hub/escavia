<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESCAVIA — Team Timer</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #161a2b 0%, #090b11 100%);
      color: #eef0f8;
      font-family: 'Inter', system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .landing {
      max-width: 540px;
      width: 100%;
      padding: 32px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      background: rgba(17, 22, 36, 0.9);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .landing h1 {
      margin-bottom: 14px;
      font-size: clamp(2.3rem, 5vw, 3.4rem);
      letter-spacing: -0.05em;
    }
    .landing p {
      margin-bottom: 28px;
      color: var(--text-dim);
      line-height: 1.8;
    }
    .landing .links {
      display: grid;
      gap: 12px;
    }
    .landing a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .landing a:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(108, 99, 255, 0.25);
    }
    .landing .small-link {
      background: rgba(255,255,255,0.08);
      color: #eef0f8;
    }
  </style>
</head>
<body>
  <div class="landing">
    <h1>ESCAVIA — Team Timer</h1>
    <p>Welcome to the synchronized team timer app. Use the buttons below to join a team timer or open the admin panel.</p>
    <div class="links">
      <a href="/join">Join as Contestant</a>
      <a class="small-link" href="/admin">Admin Panel</a>
    </div>
  </div>
</body>
</html>
