<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESCAVIA — Admin Panel</title>
  <meta name="description" content="ESCAVIA event admin control panel for synchronized team timers." />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ─── Admin-specific styles ─────────────────────────────────────────── */
    body { min-height: 100vh; display: flex; flex-direction: column; }

    .admin-main {
      flex: 1;
      padding: 28px 32px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* Setup bar */
    .setup-bar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .setup-bar-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .setup-bar .input {
      max-width: 200px;
      font-size: 0.82rem;
      padding: 8px 12px;
      display: none; /* Hidden - we use inline team name editing */
    }

    /* Grid */
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    /* Team Card */
    .team-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: border-color 0.3s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }
    .team-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--idle), transparent);
      transition: background 0.5s;
    }
    .team-card.running {
      border-color: rgba(16, 185, 129, 0.25);
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.06);
    }
    .team-card.running::before {
      background: linear-gradient(90deg, transparent, var(--running), transparent);
    }
    .team-card.paused {
      border-color: rgba(245, 158, 11, 0.2);
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.04);
    }
    .team-card.paused::before {
      background: linear-gradient(90deg, transparent, var(--paused), transparent);
    }
    .team-card.stopped {
      border-color: rgba(239, 68, 68, 0.2);
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.04);
    }
    .team-card.stopped::before {
      background: linear-gradient(90deg, transparent, var(--stopped), transparent);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 10px;
    }

    .team-name-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      padding: 4px 0;
      width: 160px;
      outline: none;
      transition: border-color 0.2s;
    }
    .team-name-input:focus {
      border-bottom-color: var(--accent);
    }
    .team-name-input::placeholder { color: var(--text-muted); }

    /* Timer display */
    .card-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      text-align: center;
      padding: 12px 0;
      transition: color 0.3s;
    }
    .team-card.running  .card-timer { color: var(--running); }
    .team-card.paused   .card-timer { color: var(--paused);  }
    .team-card.stopped  .card-timer { color: var(--stopped); }

    /* Controls */
    .card-controls {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .card-controls .btn { flex: 1; min-width: 60px; }

    /* Link row */
    .card-link {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
    }
    .card-link-url {
      flex: 1;
      font-size: 0.72rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Save team names bar */
    .save-bar {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 100px;
      padding: 10px 20px;
      box-shadow: var(--shadow);
      z-index: 50;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    .save-bar.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .save-bar-text { font-size: 0.82rem; color: var(--text-dim); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      transform: scale(0.96);
      transition: transform 0.2s;
      box-shadow: var(--shadow);
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal h3 { font-size: 1.1rem; margin-bottom: 10px; }
    .modal p { color: var(--text-dim); font-size: 0.88rem; margin-bottom: 24px; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .modal-actions .btn { min-width: 100px; }

    @media (max-width: 600px) {
      .admin-main { padding: 16px; }
      .teams-grid { grid-template-columns: 1fr; }
      .card-timer { font-size: 2rem; }
    }
  </style>
</head>
<body>

<!-- ─── Auth Overlay ──────────────────────────────────────────────────────── -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-logo">ESCAVIA</div>
    <div class="auth-subtitle">Admin Panel — Enter your PIN to continue</div>
    <input
      id="pinInput"
      type="password"
      class="input"
      placeholder="••••••"
      maxlength="20"
      autocomplete="current-password"
    />
    <button id="pinSubmit" class="btn btn-primary" style="width:100%; margin-top:4px; padding:12px;">
      Unlock Admin Panel
    </button>
    <div class="auth-error" id="pinError"></div>
  </div>
</div>

<!-- ─── Page Header ───────────────────────────────────────────────────────── -->
<header class="page-header" id="pageHeader" style="display:none;">
  <div class="page-logo">ESCAVIA</div>
  <div class="page-tag">Admin</div>
  <div class="header-spacer"></div>
  <button class="btn btn-start-all" id="startAllBtn" title="Start all 6 team timers simultaneously">
    ▶▶ Start All Teams
  </button>
  <div class="connection-dot" id="connDot"></div>
  <span class="connection-label" id="connLabel">Connecting…</span>
</header>

<!-- ─── Main ──────────────────────────────────────────────────────────────── -->
<main class="admin-main" id="adminMain" style="display:none;">
  <div class="teams-grid" id="teamsGrid"></div>
</main>

<!-- ─── Floating Save Bar ─────────────────────────────────────────────────── -->
<div class="save-bar" id="saveBar">
  <span class="save-bar-text">Team names changed</span>
  <button class="btn btn-primary" id="saveNamesBtn" style="padding:8px 20px; font-size:0.8rem;">Save Names</button>
</div>

<!-- ─── Reset Confirm Modal ───────────────────────────────────────────────── -->
<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <h3>Reset Timer?</h3>
    <p id="resetModalText">This will reset the timer to 00:00:00 and set the team to Idle. This cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-reset" id="resetCancelBtn">Cancel</button>
      <button class="btn btn-stop" id="resetConfirmBtn">Reset</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="admin.js"></script>
</body>
</html>
